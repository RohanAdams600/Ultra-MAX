name: TSLA wheel check

# Every 15 minutes on weekdays, 13:00-20:59 UTC (covers 9:30-16:00 ET in both
# EST and EDT). wheel.py checks Alpaca's clock and does nothing when the
# market is closed. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wheel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run wheel check
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
        run: python3 wheel/wheel.py
      - name: Save state
        run: |
          git diff --quiet wheel/state.json 2>/dev/null && [ -z "$(git status --porcelain wheel/state.json)" ] && exit 0
          git config user.name "wheel-bot"
          git config user.email "wheel-bot@users.noreply.github.com"
          git add wheel/state.json
          git commit -m "wheel: update state"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
